<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="A game made with the PuzzleScriptNext game engine.">
<title>PuzzleScript Next Game</title>
<style>
body {
  background-color:black;
  font-family:"Courier New", Courier, monospace;
  touch-action: none;
}

#gameCanvas {
  position:absolute;
  top: 0px;
  left: 0px;
  width: 100%;
  height: 100%;
  bottom: 0px;
  right:0px;
  border: 0px;
  background-color: black;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-crisp-edges;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
} 

.homepagelink {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 50%;
}

h1 {
  color:lightblue;
  font-weight:normal;
  white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    height:2em;
    margin-top:0.5em;
    margin-bottom: 0.5em;
}

a {
  color:lightblue;
}

.title {  
  background-color:none;
  text-align:center;
  font-size:100%;
  float:center;
  color:gray;
  position:absolute;
  left:10%;
  right:10%;
  top:0%;
  height:3em;
}

.footer { 
  background-color:none;
  text-align:center;
  float:center;
  color:white;
  position:absolute;
  left:0%;
  right:0%;
  height:3em;
  bottom:0;
}
.gameContainer {
  background-color:none;
  position:absolute;
  left:00%;
  right:00%;
  top:3.5em;
  bottom:3em;
    touch-action: none;
}


canvas:focus { outline: none; }


.mobile-menu {
    position: relative;
    top: 5em;
    margin-left: auto;
    margin-right: auto;
    font-weight: bold;
    border-radius: 0.25em;
}

.mobile-menu.item-count-3 {
    width: 30em;
}
.mobile-menu.item-count-3 .button {
    width: 28.3333%;
    /* scale the height of the button relative to the width of .mobile-menu */
    padding: 7.5% 0%;
}

.mobile-menu.item-count-2 {
    width: 20em;
}
.mobile-menu.item-count-2 .button {
    width: 46%;
    /* scale the height of the button relative to the width of .mobile-menu */
    padding: 12.1765% 0%;
}

.mobile-menu.item-count-1 {
    width: 10em;
}
.mobile-menu.item-count-1 .button {
    width: 98%;
    /* scale the height of the button relative to the width of .mobile-menu */
    padding: 26.5% 0%;
}

.mobile-menu,
.tab-icon,
.mobile-menu .close {
    background: rgba(0,0,0,0.4);
    border: 2px solid rgba(255, 255, 255, 0.4);
    color: rgba(255, 255, 255, 1);
}

.mobile-menu .button {
    margin: 2%;
    border-radius: 0.25em;
    text-align: center;
    float: left;
}
.mobile-menu .clear {
    clear: both;
}

.tab-affordance,
.close-affordance {
    width: 6em;
    height: 6em;
    position: absolute;
    z-index: 1000;
}

.tab-affordance {
    left: -2em;
    top: 5em;
}

.close-affordance {
    left: -4em;
    top: -1em;
}

.tab-icon,
.mobile-menu .close {
    height: 48px;
    position: absolute;
    border-radius: 6px;
}

.tab-icon {
    left: 0;
    top: 70px;
    width: 18px;
    border-radius: 0 6px 6px 0;
    border-left: 0;
}

.mobile-menu .close {
    left: -18px;
    width: 18px;
    top: 0px;
    border-radius: 6px 0 0 6px;
    border-right: 0;
}

.tab-icon .slice,
.mobile-menu .close .slice {
    margin: 4.5px 1px;
    width: 2px;
    height: 80%;
    background: rgba(255, 255, 255, 0.4);
}

.tab-icon .slice {
    float: right;
}

.tab-icon .slice:first-child {
    margin-right: 4.5px;
}

.mobile-menu .close .slice {
    float: left;
}
.mobile-menu .close .slice:first-child {
    margin-left: 4.5px;
}

@media screen and (max-width: 32em) {
    .mobile-menu {
        font-size: 0.8em;
        width: 90%;
    }
}
@media screen and (max-width: 24em) {
    .mobile-menu {
        font-size: 0.65em;
        width: 90%;
    }
}

.disable-select {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

a {
    display:inline-block;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 80%;
}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<body>
<div class="title"><h1 id="gametitle">PuzzleScript Game</h1></div>
<div class="gameContainer">
<canvas id="gameCanvas"></canvas>
</div> 
<div class="footer">
<span id="errormessage" style="color:red;"></span>
<a id="homepagelink" href="https://github.com/david-pfx/PuzzleScriptNext">Made with PuzzlescriptNext</a> <span id="separator">|</span> <a id="hacklink" href="#">hack</a>
</div>

<script src="js/scripts_play_compiled.js"></script>
<script src="js/solution_player.js"></script>

<script>

function displayError(message) {
  var errorText = document.getElementById("errormessage");
  errorText.innerHTML="ERROR "+message+"<br>";

}
function getParameterByName(name) {
    name = name.replace(/[\[]/, "\\\[").replace(/[\]]/, "\\\]");
    var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
        results = regex.exec(location.search);
    return results == null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
}

function strip_http(url) {
   url = url.replace(/^https?:\/\//,'');
   return url;
}

function getData() { 
  let id = getParameterByName("p").replace(/[\\\/]/,"");
  if (id && id.length > 0) {
        tryLoadGist(id, `https://api.github.com/gists/${id}`);
    } else {
        id = getParameterByName("demo");
      if (id && id.length > 0) {
            tryLoadFile(id, `demo/${id}.txt`);
        } else {
        //displayError("No ID specified in URL.")
        //return;
          tryLoadFile(0, `scripts/ootss.pz`);
        }
  }
}

function tryLoadGist(id, githubURL) {

  var githubHTTPClient = new XMLHttpRequest();
  githubHTTPClient.open('GET', githubURL);
  githubHTTPClient.onreadystatechange = function() {
    if(githubHTTPClient.readyState!=4) {
      return;
    }   
    var result = JSON.parse(githubHTTPClient.responseText);
    if (githubHTTPClient.status===403) {
      displayError(result.message);
    } else if (githubHTTPClient.status!==200&&githubHTTPClient.status!==201) {
      displayError("HTTP Error "+ githubHTTPClient.status + ' - ' + githubHTTPClient.statusText);
    }
    var result = JSON.parse(githubHTTPClient.responseText);
    prepareForPlay(`hack=${id}`, result["files"]["script.txt"]["content"]);
    }
    // if (storage_has('oauth_access_token')) {
    //     var oauthAccessToken = storage_get("oauth_access_token");
    //     if (typeof oauthAccessToken === "string") {
    //         githubHTTPClient.setRequestHeader("Authorization","token "+oauthAccessToken);
    //     }
    // }
  githubHTTPClient.setRequestHeader("Content-type","application/x-www-form-urlencoded");
  githubHTTPClient.send();
}

function tryLoadFile(id, fileName) {
  var fileOpenClient = new XMLHttpRequest();
  fileOpenClient.open('GET', fileName);
  fileOpenClient.onreadystatechange = function() {
    
      if (fileOpenClient.readyState!=4)
        return;
    if (fileOpenClient.status != 200 && fileOpenClient.status != 201) {
      displayError("HTTP Error "+ fileOpenClient.status + ' - ' + fileOpenClient.statusText);
    } else {
      prepareForPlay(`demo=${id}`, fileOpenClient.responseText);
    }
  }
  fileOpenClient.send();
}

function prepareForPlay(hackArg, code) {
    compile(["restart"],code);

    if (state.metadata.homepage!==undefined) {
        var homepage=state.metadata.homepage;
        var homepageLink = document.getElementById("homepagelink");
        // refers to a specific simple game -- with an embedded exploit!
        // if (id==="2fe3172d2b9fe684977d184f1b6226d5"){
        //     // https://github.com/increpare/PuzzleScript/issues/829
        //     // Supporting vulnerability on legacy grounds to enable Pushing It:
        //     // https://www.puzzlescript.net/play.html?p=2fe3172d2b9fe684977d184f1b6226d5
        //     homepageLink.innerHTML=strip_http(homepage);
        // } else {
        //sanitize tags from title   
        homepageLink.textContent=strip_http(homepage);
        // }
        
        if (!homepage.match(/^https?:\/\//)) {
            homepage = "https://" + homepage;
        }
        homepageLink.href = homepage;
    }
    if (state.metadata.title!==undefined) {
        var title=state.metadata.title;
        var gametitle = document.getElementById("gametitle");
        gametitle.textContent=title;
        window.document.title=title+" - PuzzleScriptNext Game";
    }
            
    var hacklink = document.getElementById("hacklink");
    //var url = `https://xxuurruuii.github.io/PuzzleScriptNext/src/editor.html?${hackArg}`;
    var url = 'https://xxuurruuii.github.io/PuzzleScriptNext/src/editor.html?hack=3e771b4e87a613be37aaeb7aeea17d3d';
    url=qualifyURL(url);
    hacklink.href=url;

    let m = document.getElementById('muteButton'); m && m.addEventListener('click', ()=>{ localStorage.mute = true; });
    m = document.getElementById('unMuteButton'); m && m.addEventListener('click', () => { localStorage.removeItem('mute'); });

    if (localStorage.mute) {
      muteAudio();
    }

}

getData();

</script>
