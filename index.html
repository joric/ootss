<script>

let localDataName = 'joricsOotSS';
let localData = JSON.parse(localStorage.getItem(localDataName)) || {};
let settings = localData;

function saveSettings() {
  localStorage.setItem(localDataName, JSON.stringify(localData));
}

function resetLocalData() {
  localStorage.removeItem(localDataName);
  location.reload();
}

function loadLocalDataFile() {
  var file = document.querySelector("#localFile").files[0];
  if (file) {
    var reader = new FileReader();
    reader.readAsText(file, "UTF-8");
    reader.onload = function (evt) {
      let data = evt.target.result;
      evt.target.value = null;
      try {
        localData = JSON.parse(data);
        settings = localData;
        console.log('New settings loaded.');
        saveSettings();
        location.reload();
      } catch(e) {
        console.log(e);
      }
    }
    reader.onerror = function (evt) {
      alert('error reading file');
    }
  }
}

function loadLocalData() {
  document.querySelector('#localFile').onchange = function(e) {
    loadLocalDataFile();
  }
  document.querySelector('#localFile').value = null;
  document.querySelector('#localFile').accept = '.json';
  document.querySelector('#localFile').click();
}

function saveTextToFile(data, filename) {
  if (window.showSaveFilePicker) {
    window.showSaveFilePicker({suggestedName: filename}).then(f=>f.createWritable()).then(f=>f.write(data).then(()=>f.close()));
  } else {
    let blob = new Blob([data], {type: "text/json"});
    if(navigator.msSaveOrOpenBlob) {
        navigator.msSaveOrOpenBlob(blob, filename);
    } else {
        var a = document.body.appendChild(document.createElement("a"));
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        a.remove();
    }
  }
}

function saveLocalData() {
  let data = localStorage.getItem(localDataName);
  data = JSON.stringify(JSON.parse(data), null, 2);
  saveTextToFile(data, localDataName+'.json');
}

async function loadSave(file) {
  const buffer = await file.arrayBuffer();
  const d = new Uint8Array(buffer);
  const view = new DataView(buffer);
  const decoder = new TextDecoder("utf-8");

  // Level_State_Flags: SOLVED 1, PARTIALLY_SOLVED 2, ENTERED 4 (never set), TOWER_UNLOCK_SIGNALLED 8
  const SOLVED = 1;
  // Oldest saves: 0x71 + u32 + 2 bytes -> first string (currentLevel) starts here
  const OLD_START = 0x77;
  const SCAN_LIMIT = 4096;

  // Try to read the body with currentLevel's string at `start`.
  // Returns null if what's there doesn't look like a level table.
  const parseAt = (start) => {
    let off = start;
    const ok = (n) => off + n <= d.length;
    const u8 = () => d[off++];
    const u32 = () => { const v = view.getUint32(off, true); off += 4; return v; };
    // u16 length + printable ASCII; null if it doesn't fit
    const string = (min) => {
      if (!ok(2)) return null;
      const n = view.getUint16(off, true);
      if (n < min || !ok(2 + n)) return null;
      for (let i = off + 2; i < off + 2 + n; i++) if (d[i] < 0x20 || d[i] > 0x7e) return null;
      const s = decoder.decode(d.subarray(off + 2, off + 2 + n));
      off += 2 + n;
      return s;
    };

    // empty current/menu names are only trusted at the known old position
    const minLen = start === OLD_START ? 0 : 1;
    const currentLevel = string(minLen);
    if (currentLevel === null) return null;
    const menuLevel = string(minLen);
    if (menuLevel === null) return null;
    if (!ok(4)) return null;

    // ---- level table ----
    const n = u32();
    if (n * 4 > d.length - off) return null;           // each entry is >= 4 bytes
    if (n === 0 && start !== OLD_START) return null;
    const levels = [];   // every level that has an entry
    const solved = [];   // only fully solved levels
    for (let i = 0; i < n; i++) {
      const name = string(1);
      if (name === null || !ok(1)) return null;
      const flags = u8();
      levels.push({ name, flags });
      if (flags & SOLVED) solved.push({ name, flags });
    }

    // ---- trailing tables: u32 count + count * u32, repeated until EOF ----
    const tables = [];
    while (ok(4)) {
      const c = u32();
      if (c * 4 > d.length - off) { off -= 4; break; }
      const t = [];
      for (let i = 0; i < c; i++) t.push(u32());
      tables.push(t);
    }

    console.log('currentLevel', currentLevel);

    return {
      levels, solved, currentLevel, menuLevel, tables,
      version: start >= 6 ? view.getUint32(start - 6, true) : 0,
      flags: start >= 6 ? [d[start - 2], d[start - 1]] : [0, 0],
      start,
      clean: off === d.length,   // tables ended exactly at EOF
    };
  };

  // Try the old position first; if the header has grown, scan for the real start.
  // Prefer a candidate whose trailing tables end exactly at EOF.
  const starts = [OLD_START];
  for (let p = 0; p < Math.min(d.length, SCAN_LIMIT); p++) if (p !== OLD_START) starts.push(p);

  let best = null;
  for (const p of starts) {
    const r = parseAt(p);
    if (!r) continue;
    if (r.clean) return r;
    if (!best) best = r;
  }
  if (best) return best;
  throw new Error("Unrecognized save format: no level table found in the first " + SCAN_LIMIT + " bytes");
}

function pickAndLoadSave() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".sokoban_status,*/*";
  input.style.display = "none";

  input.addEventListener("change", async (event) => {
    const file = event.target.files && event.target.files[0];
    input.remove();
    if (!file) return;

    try {
      const { levels, solved, currentLevel } = await loadSave(file);

      settings.markedItems = {};

      for (const level of solved) {
        settings.markedItems[baseName(level.name)] = true;
      }

      markItems();
      saveSettings();

      showAlert(`Marked ${solved.length} levels`);

      if (currentLevel != 'overworld') {
        focusMarkerByName(currentLevel);
      }


    } catch (err) {
      showAlert('Failed to parse save');
      console.error("Failed to parse save:", err);
    }
  });

  document.body.appendChild(input);
  input.click();
}

function getSolutionPlayerLink(name, solvable) {
  if (solvable) {
    return `play.html#${name}`;
  }
  return `https://github.com/joric/ootss/wiki#solutions`;
}

function focusMarkerByName(name) {

  let found = null, parent = null;
  for (const g of Object.values(layers)) {
    if (!g.eachLayer) continue;
    g.eachLayer(l => {
      if (!found && l instanceof L.Marker && l.feature?.properties?.name === name) {
        found = l;
        parent = g;
      }
    });
    if (found) break;
  }

  if (parent && !map.hasLayer(parent)) parent.addTo(map);

  if (!found) return;

  let base = getBaseLayer(found.feature);
  let layer = baseLayers[base];

  setBaseLayer(base);

  if (found==currentOpenMarker) return;

  found.fire('click');
  found.closeTooltip();

  map.panTo(found.getLatLng(), { animate: false });

  return false; // in case of js clicking
}


function getMarkerColor(x, y, v = 100, sx = 1, sy = sx) {
  const b = { left: -77, top: 221.5, right: 219, bottom: 74 };
  const dx = (x - (b.left + b.right) / 2) / (Math.abs(b.right - b.left) / 2 * sx);
  const dy = -(Math.min(b.top, b.bottom) - y) / (Math.abs(b.top - b.bottom) / 2 * sy);
  const h = Math.atan2(dx, dy) * 3 / Math.PI;
  const s = Math.min(Math.hypot(dx, dy), 1);
  const f = n => { const k = (n + h + 6) % 6; return Math.round(2.55 * v * (1 - s * Math.max(0, Math.min(k, 4 - k, 1)))).toString(16).padStart(2, '0') };
  return `#${f(5)}${f(3)}${f(1)}`;
}


function getIconHTML(feature, size=48) {
  const o = feature.properties;
  let title = o.title;
  let options = null;

  options = options || {class:'fa fa-circle', bg:'dimgrey'};

  let areaColors = {'sky': 'royalblue', 'underworld': 'brown'};

  let color = regionColors[o.area] || (o.type=='Level_Entry' && areaColors[getBaseLayer(feature)]) || 'dimgrey';

  options.bg = color;

  //let c = feature.geometry.coordinates;
  //options.bg = getMarkerColor(c[0],c[1]);

  if (feature.properties.area=='locations') {
    options.bg = 'dimgrey';
    options.class = 'fa fa-location';
    title = '';
  }

  let label = o.name || o.type;

  if (o.type=='Freezer') {
    label = `Freezer`;
    let id = o.entity_properties?.unlocked_by_id;

// lazy loading for gallery images (no IntersectionObserver, works on file:// too)
// images carry data-src, real src is set only for slides near the active/visible ones

function loadSlides(slides, from, to) {
  for (let i = Math.max(0, from); i <= Math.min(slides.length - 1, to); i++) {
    const img = slides[i].querySelector('img[data-src]');
    if (img) {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
    }
  }
}

function lazyLoad() {
  if (!mainSwiper || !thumbSwiper || !isGalleryOpen()) return;
  const a = mainSwiper.activeIndex;
  loadSlides(mainSwiper.slides, a - 2, a + 2); // current image first, then neighbours

  let lo = Infinity, hi = -1;
  thumbSwiper.slides.forEach((s, i) => {
    if (s.classList.contains('swiper-slide-visible')) { lo = Math.min(lo, i); hi = Math.max(hi, i); }
  });
  if (hi < 0) lo = hi = a;
  loadSlides(thumbSwiper.slides, lo - 8, hi + 8);
}

function openGallery(name) {

    if (index) {

  })

unpackSolution = s => s.replace(/([A-Z])(\d+)/g, (_,l,n)=>l.repeat(+n))

//convertSolution = s => s

const packSolution = s => s.replace(/(.)\1*/g, (match, char) => char + (match.length > 1 ? match.length : ''));
//const convertSolution = s => { return s.split(' ').map(packSolution).join(' '); }

const convertSolution = s => {
  return s
    .split(' ')
    .map(segment => {
      // Split into: [plain, macro, plain, macro, ..., plain]
      // Even indices are plain text (to compress);
      // odd indices are `_..._` macros (to keep verbatim).
      const parts = segment.split(/(_[^_]*_)/g);
      return parts
        .map((part, i) => (i % 2 === 1 ? part : packSolution(part)))
        .join('');
    })
    .join(' ');
};



function getCentroidRaw2(points) {
    if (!points || points.length < 3) return null;
    
    // Ensure polygon is closed (last point = first point)
    let closedPoints = [...points];
    if (closedPoints[0][0] !== closedPoints[closedPoints.length-1][0] || 
        closedPoints[0][1] !== closedPoints[closedPoints.length-1][1]) {
        closedPoints.push([closedPoints[0][0], closedPoints[0][1], closedPoints[0][2] || 0]);
    }
    
    let area = 0;
    let centroidX = 0;
    let centroidY = 0;
    
    for (let i = 0; i < closedPoints.length - 1; i++) {
        const x1 = closedPoints[i][0];
        const y1 = closedPoints[i][1];
        const x2 = closedPoints[i + 1][0];
        const y2 = closedPoints[i + 1][1];
        
        // Cross product for area contribution
        const cross = x1 * y2 - x2 * y1;
        area += cross;
        
        // Weighted sum for centroid
        centroidX += (x1 + x2) * cross;
        centroidY += (y1 + y2) * cross;
    }
    
    area = area / 2;
    
    // Handle degenerate polygons (area = 0)
    if (Math.abs(area) < 1e-10) {
        // Fallback to simple vertex average
        let sumX = 0, sumY = 0;
        const count = points.length;
        points.forEach(point => {
            sumX += point[0];
            sumY += point[1];
        });
        return [sumX / count, sumY / count, 0];
    }
    
    centroidX = centroidX / (6 * area);
    centroidY = centroidY / (6 * area);
    
    return [centroidX, centroidY, 0];
}

function getCRS(name) {
  // old map was 1920x1080 and the grid was almost precisely 10 pixels
  // center was at 860, 740
  // so basically an overhead screenshot is 192x108 grid
  // with grid center at cell 86,74 if count from top left corner

  let d = 190;

  let m = {
    size: d,
    bounds: [[0,0],[190,190]],
    center: [0,0],
    flip_y: true,
  }

  let b = config[name]?.bounds;
  if (b) {
    let dd = b.right-b.left;
    m.size = dd;
    //m.bounds = [[0,0],[dd,dd]];
    //m.center = [-b.top,-b.left];
    m.bounds = [[b.left,b.top],[b.right,b.bottom]];
    m.center = [b.left + (b.right-b.left)/2, -(b.top+(b.bottom-b.top)/2)+0.5]
  }


  let tileSize = 512; // this is essentially map size in tiles on zoom level 0
  let size = tileSize*tileSize; // default map width in pixels is tileSize squared

  // custom map weighted (scaled) dimensions (usually 0..1)
  let [sw,sh] = [m.size, m.size].map(e => e / size);
  let [sx,sy] = m.center.map(e => e / size);

  // calculate factor and offset for the custom map
  let factor = 1 / tileSize / sw;
  let dx = (.5 - sx / sw) * tileSize;
  let dy = (.5 - sy / sh) * tileSize;

  // correct bounds (still need to flip x and y for leaflet)
  let [w,h] = [m.size, m.size];
  let [x,y] = m.center;

  let [[left,top],[right,bottom]] = m.bounds;
  let bounds = [[top, left], [bottom, right]];
  let center = [(m.flip_y ? -1 : 1) * y, x];

  //console.log('bounds:', JSON.stringify({left: left, top:top, right:right, bottom: bottom}))
  //console.log('center:', JSON.stringify({left: center[1], top: center[0]}))

  // crs.transformation represents an affine transformation:
  let crs = L.CRS.Simple;
  // a set of coefficients a, b, c, d for transforming a point of a form (x,y) into (a*x + b, c*y + d)
  crs.transformation = new L.Transformation(factor, dx, (m.flip_y ? -1 : 1) *  factor, dy); // Invert the y-axis

  return {crs: crs, center: center};
}

const hp = (() => {
  const el  = document.getElementById('hoverPreview');
  const img = el.querySelector('img');
  const ttl = el.querySelector('.hp-title');

  let showT = null, hideT = null;
  let cur = null;
  let frozen = false;
  let gen = 0;

  // --- geometry ---------------------------------------------------

  function size() {
    const w = Math.min(800, innerWidth * 0.92);
    const h = Math.min(w * 9 / 16, innerHeight * 0.82);
    return { w: h * 16 / 9, h };
  }

  function place(x, y) {
    const { w, h } = size();
    el.style.width  = w + 'px';
    el.style.height = h + 'px';
    let L = x + 24, T = y + 24;
    if (L + w > innerWidth  - 12) L = x - w - 24;
    if (T + h > innerHeight - 12) T = innerHeight - h - 12;
    el.style.left = Math.max(12, L) + 'px';
    el.style.top  = Math.max(12, T) + 'px';
  }

  // --- show / hide ------------------------------------------------

  function show(name, title, x, y) {
    const myGen = ++gen;
    cur = name;
    ttl.textContent = title || name;
    img.title = title || name;
    place(x, y);
    frozen = true;

    const src = `${image_base}/images/levels/${name}.webp`;
    if (img.getAttribute('src') !== src) img.src = src;
    el.classList.add('visible');
  }

  function hide() {
    cur = null;
    frozen = false;
    gen++;
    el.classList.remove('visible');
  }

  // --- events -----------------------------------------------------

  el.addEventListener('mouseenter', () => clearTimeout(hideT));
  el.addEventListener('mouseleave', () => {
    clearTimeout(hideT);
    hideT = setTimeout(hide, 180);
  });

  const popupOpen = (m) => !!(m && m.isPopupOpen && m.isPopupOpen());

  return {
    enter(name, title, x, y, marker) {
      if (popupOpen(marker)) return;

      // start the load now; the 1000ms delay is the load window
      if (imageList[name]) new Image().src = `${image_base}/images/levels/${name}.webp`;

      const g = ++gen;
      clearTimeout(hideT);
      clearTimeout(showT);
      showT = setTimeout(() => {
        if (g !== gen || popupOpen(marker)) return;
        show(name, title, x, y);
      }, 1000);
    },

    move(x, y, marker) {
      if (popupOpen(marker)) return;
      if (el.classList.contains('visible') && !frozen) place(x, y);
    },

    leave() {
      clearTimeout(showT);
      clearTimeout(hideT);
      hideT = setTimeout(hide, 180);
    },

    hide
  };
})();

function drawMap() {

  for (const name of Object.keys(config)) {

    let b = config[name].bounds;
    let bounds = [[b.top,b.left],[b.bottom,b.right]]

    //baseLayers[`${name}_64k`] = L.tileLayer.canvas(`${tileset_base}/tiles/${name}_64k/{z}/{y}/{x}.webp`, {
    baseLayers[name] = L.tileLayer(`${tileset_base}/tiles/${name}_64k/{z}/{y}/{x}.webp`, {
      tileSize: 512,
      maxNativeZoom: 7,
      //edgeBufferTiles: 1,
      bounds: bounds,
      attribution: '<a href="https://github.com/joric/ootss/wiki" target=_blank>About the Map</a>',
    });
  }

  let baseLayer = Object.values(baseLayers)[0]

  if (!settings.activeLayers) {
    settings.activeLayers = {'overworld':true, 'levels':true, 'freezers': true, 'areas': true};
  }

  settings.markedItems = settings.markedItems ?? {};

  let crs = L.CRS.Simple;

  for (const [k,v] of Object.entries(baseLayers)) {
    if (settings.activeLayers[k]) {
      crs = getCRS(k);
    }
  }

  map = L.map('map', {
    crs: crs.crs,
    zoom: 0,
    center: crs.center,
    zoomControl: false,
    maxZoom: 7,
    renderer: L.canvas({ padding: 0.5 }),
    zoomSnap: 0.5,
    //zoomDelta: 0.5,
    //wheelPxPerZoomLevel: 100,
  });

  map.on('overlayadd', function(e) {
    settings.activeLayers[e.layer.id] = true;
    syncSearchLayer();
    updateMarkers();
    saveSettings();
  });

  map.on('overlayremove', function(e) {
    delete settings.activeLayers[e.layer.id];
    saveSettings();
  });

  map.on('baselayerchange', function(e) {
    baseLayerChange(e.name);
    for (const [k,v] of Object.entries(baseLayers)) {

      if (e.name==k) {
        settings.activeLayers[k] = true;
      } else {
        delete settings.activeLayers[k];
      }
    }

    saveSettings();
  });

  if (settings.center) {
    map.setView(settings.center, settings.zoom, { animate: false });
  }

  map.on('moveend zoomend', function(e) {
    settings.center = [map.getCenter().lat, map.getCenter().lng]; // avoid circular refs here
    settings.zoom = map.getZoom();
    saveSettings();
  });

  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.control.mousePosition({lngFirst: true, latFormatter:Math.round, lngFormatter:Math.round }).addTo(map);


  // add toolbar
  const BaseAction = L.Toolbar2.Action.extend({
    _createIcon(...args) {
      const r = L.Toolbar2.Action.prototype._createIcon.apply(this, args);
      L.DomEvent.on(this._link, 'click', L.DomEvent.preventDefault);
      return r;
    },
  });

  const ImmediateAction = BaseAction.extend({
    initialize(map) {
      L.Toolbar2.Action.prototype.initialize.call(this);
      this.disableTime = Date.now();
      map.on('click', () => this.disable());
    },
    enable() {
      if (Date.now() - this.disableTime > 100) L.Toolbar2.Action.prototype.enable.call(this);
    },
    disable() {
      if (this._enabled) this.disableTime = Date.now();
      L.Toolbar2.Action.prototype.disable.call(this);
    },
  });

  const ImmediateSubAction = BaseAction.extend({
    initialize(map, myAction) {
      this.map = map;
      this.myAction = myAction;
      L.Toolbar2.Action.prototype.initialize.call(this);
    },
    addHooks() {
      this.myAction.disable();
    },
  });

  const cancelAction = ImmediateSubAction.extend({
    options: { toolbarIcon: { html: '&times;', tooltip: 'Cancel' } },
  });

  const action = (tooltip, html, actions) => ImmediateAction.extend({
    options: {
      toolbarIcon: { html, tooltip },
      subToolbar: new L.Toolbar2({ actions: [...actions, cancelAction] }),
    },
  });

  const subAction = (html, callback, tooltip, keepOpen) => ImmediateSubAction.extend({
    options: { toolbarIcon: { html, tooltip: tooltip || html } },
    addHooks() {
      if (typeof callback === 'function') callback();
      if (!keepOpen) ImmediateSubAction.prototype.addHooks.call(this);
    },
  });

  new L.Toolbar2.Control({
    position: 'bottomleft',
    actions: [
      action('Settings', '&#x2699;&#xFE0F;', [
        subAction('Load Settings', loadLocalData),
        subAction('Save Settings', saveLocalData),
        subAction('Reset Settings', () => confirm('Are you sure you want to reset settings?') && resetLocalData()),
      ]),
      action('Import Data', '&#x1F4C1;', [
        subAction('Copy Save Path', () => copyToClipboard('%USERPROFILE%\\Saved Games\\Order of the Sinking Star'), null, true),
        subAction('Import Save File', pickAndLoadSave),
      ]),
    ],
  }).addTo(map);


  // Fit map to image bounds
  //map.fitBounds(bounds);

  markerGroup = L.layerGroup().addTo(map);

/*
  let regionLayer = L.layerGroup();

  polygonLayer = L.geoJSON(regionData, {
      onEachFeature: (feature, layer) => {

        layer.setStyle({
            color: feature.properties.color,
            weight: 1,
            fillOpacity: 0.25
        });

        regionColors[feature.properties.name] = feature.properties.color;

        layer.on('mouseover', function(e) { this.setStyle({ fillOpacity: 0.5, weight: 2,}); this.bringToFront(); });
        layer.on('mouseout', function(e) { this.setStyle({ fillOpacity: 0.25, weight: 1, })});


        let c = getCentroidRaw2(feature.geometry.coordinates[0]);

        //console.log(c);

        let marker = L.marker([c[1],c[0]], {
            icon: L.divIcon({
                className: 'region-label',
                html: feature.properties.title,
                iconSize: [500, 100],
                iconAnchor: [250, 50],
            }),
            zIndexOffset: 1000,
        }).addTo(regionLayer);

        marker.feature = feature;

      },
  });//.addTo(map);
*/


  for (const [k,v] of Object.entries(baseLayers)) {
    if (settings.activeLayers[k]) {
      v.addTo(map);
      baseLayerName = k;
    }
  }


  // markers
  {
    counters = {};
    layers = {};


    function getImageBounds(cellSize, iw,ih, dx, dy) {
      let tw = iw/cellSize;
      let th = ih/cellSize;
      let top = dy;
      let left = dx;
      let bottom = th+dy;
      let right = tw+dx;
      return [[top,left],[bottom,right]];
    }


    gridLayer = L.layerGroup();

    gridLayer.id = 'grid'; // for settings

    gw = 19;
    gh = 13;

    cx = 80;
    cy = 69;

    d = gh*10;

    const hCells = 11;
    const vCells = 12;

    const origin = [cy - gh/2 + gh, cx];

    const bounds = [
        [origin[0] - (vCells/2)*gh, origin[1] - (hCells/2)*gw],
        [origin[0] + (vCells/2)*gh, origin[1] + (hCells/2-1)*gw],
    ];

    const gridStyle = { color: '#fff', weight: 1.5, opacity: 0.7 };

    const lngStep = 1 * gw;//(bounds[1][1] - bounds[0][1]) / steps;
    const latStep = 1 * gh;//(bounds[1][0] - bounds[0][0]) / steps;

    // vertical lines (meridians)
    for (let i = 0; i <= hCells-1; i++) {
        const lng = bounds[0][1] + i * lngStep;
        gridLayer.addLayer(L.polyline([
            [bounds[0][0], lng],
            [bounds[1][0], lng]
        ], gridStyle));
    }

    // horizontal lines (parallels)
    for (let i = 0; i <= vCells; i++) {
        const lat = bounds[0][0] + i * latStep;
        gridLayer.addLayer(L.polyline([
            [lat, bounds[0][1]],
            [lat, bounds[1][1]]
        ], gridStyle));
    }


    // add grid to map (visible by default)
    //gridLayer.addTo(map);

    layers['grid'] = gridLayer;
//    layers['polygons'] = polygonLayer;
//    layers['regions'] = regionLayer;

    //regionLayer.addTo(map);

    images = [];

    let area = '';

    for (const feature of allFeatures) {
      featureLookup[feature.properties.id] = feature;
      const o = feature.properties;
      nameLookup[o.id] = o.name;
    }

    // pre-create groups
    for (const group of ['areas','freezers','levels']) {
      if (!layers[group]) {
        layers[group] = L.layerGroup();
        layers[group].id = group;
        if (settings.activeLayers[group]) {
          layers[group].addTo(markerGroup);
        }
      }
    }

    for (const feature of allFeatures) {

      let o = feature.properties;

      let title = o.name;
      let name = o.name;
      let area = o.area;

      name = baseName(name);

      let solved = solutions[name] || youtube[name];
      let hasImage = imageList[name] || youtube[name];

      if (solved) {
        areaCounters[area] = (areaCounters[area] || 0) + 1;
      }
      //let count = solved ? areaCounters[area] : '?';

      let label = youtube[name] ? `\u2009\u25B6` : solutions[name] || solutions2[name] ? '\u2714' :  hasImage ? '\u22EF' : '?';

      if (o.type=='Freezer') label = '\u00D7';

      if (area != 'locations' && imageList[feature.properties.name]) {
        images.push( {src: `${image_base}/images/levels/${name}.webp`, name: name, area: area, title: title});
      }

      let [x,y,z] = feature.geometry.coordinates;

      let latlng = [feature.geometry.coordinates[1],feature.geometry.coordinates[0]];

      if (!latlng) continue;

      feature.properties.title = label;

      let group = 'levels';

      //if (o.id=='14680959') 
      //console.log(o.id, o.name);

      let marker = null;

      if (o.type == 'Level_Entry') {
        marker = customMarker(latlng, feature);
      } else if (o.type == 'Freezer') {
        // filter out non-unlocable freezers
        if (nameLookup[o.entity_properties?.unlocked_by_id]) marker = customMarker(latlng, feature);
      } else if (o.type == 'Area_Pin' ) {
        const f2 = featureLookup[o.entity_properties?.map_label_marker_id];
        if (f2) {
          const [x,y,z] = f2.geometry.coordinates;
          marker = areaMarker([y+2,x], f2, o.entity_properties?.local_area_name);
          group = 'areas';
        }
      }

      if (o.type == 'Freezer') {
        group = 'freezers';
      }

      if (!marker) continue;

      counters[feature.properties.area] = (counters[feature.properties.area]||0) +1;

      marker.feature = feature;

      marker.bindTooltip(getTooltip, {offset: [20,-35]});

      marker.on('popupopen', () => {
        currentOpenMarker = marker;
      })

      marker.on('popupclose', () => {
        currentOpenMarker = null;
        if (location.hash.length > 1) 
          history.replaceState(null, '', window.location.pathname + window.location.search);
      })

      marker.on('click', openPopup);

      marker.addTo(layers[group]);

      {
        const nm = o.name;
        if (nm && imageList[nm]) {
          const t = o.type === 'Freezer'
            ? `Freezer${nameLookup[o.entity_properties?.unlocked_by_id] ? ' [' + nameLookup[o.entity_properties.unlocked_by_id] + ']' : ''}`
            : nm;
          marker.on('mouseover', (e) => hp.enter(nm, t, e.originalEvent.clientX, e.originalEvent.clientY, marker));
          marker.on('mousemove', (e) => hp.move(e.originalEvent.clientX, e.originalEvent.clientY, marker));
          marker.on('mouseout',  () => hp.leave());
          marker.on('click',     () => hp.hide());
        }
      }

    }

    map.on('movestart zoomstart', () => hp.hide());


    let text =`Total markers: ${allFeatures.length}`;

    let alt = ''
    for (k in counters) {
      alt += `\n${k}: ${counters[k]}`;
    }

    // update overlay names to include count
    var overlaysWithCounts = Object.fromEntries(
      Object.entries(layers).map(([name, layer]) => {
        const hasMarkers = layer.getLayers ? layer.getLayers().some(l => l instanceof L.Marker) : layer instanceof L.Marker;
        const count = layer.getLayers ? layer.getLayers().filter(l => l instanceof L.Marker).length : (layer instanceof L.Marker ? 1 : 0);
        return [`${name}${hasMarkers ? ' ('+count+')' : ''}`, layer];
      })
    );

    // sort overlay names
    // overlaysWithCounts = Object.fromEntries( Object.entries(overlaysWithCounts).sort((a, b) => a[0].localeCompare(b[0])) );

    let layercontrol = L.control.layers(baseLayers, overlaysWithCounts, {collapsed: true, position: 'topright'}).addTo(map);

    searchLayer = L.layerGroup();
    syncSearchLayer();

    searchControl = new L.Control.Search({
      propertyName: 'searchText',
      initial: false,
      layer: searchLayer,
      hideMarkerOnCollapse: true,
      marker: {
        icon: false,
        circle: false,
      },
    }).addTo(map);

    // switch base layer upon search
    searchControl.on('search:locationfound', e=>{
      setBaseLayer(getBaseLayer(e.layer.feature.geometry.coordinates[2]));
      focusMarkerByName(e.layer.feature.properties.name);
    });

    const search = document.querySelector('.leaflet-control-search');
    const label = document.createElement('div');
    const camera='<svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="vertical-align:middle;margin-right:4px;"><path d="M9 3l-1.5 2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9zm3 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>'
    label.innerHTML = `<div class="leaflet-control-search-label" id="drop" title="Search by screenshot, you can drop it or paste with Ctrl+V anywhere on the map">${camera}<span></span></div><input type="file" id="file" accept="image/*" hidden>`;
    search.appendChild(label);

    initImageSearch(matches=>{
      if (matches && matches.length>0) {
        console.log('matches', matches);
        let name = matches[0].name;
        name = name.replaceAll('.webp','');
        if (name) {
          focusMarkerByName(name);
        }
      } else {
        showAlert('Image Not Found');
      }
    });


    map.on('zoom overlayadd', updateZoom);
    updateZoom();

    updateMarkers();

    images.sort((a, b) => {
      const ia = order[a.name] ?? Infinity;
      const ib = order[b.name] ?? Infinity;
      return ia - ib;
    });

    initImages();

    let name = mapParam.markerName;
    mapParam = {};
    if (name) {
      focusMarkerByName(name);
    } else {
      baseLayerChange(baseLayerName); // closes popup internally
    }
  }

  function drawGrid() {

    svgLayer = layers['grid'] || L.svg({padding: 2});

    svgLayer.addTo(map);

    svg = svgLayer._container;

    if (!svg) return;

    while (svg.firstChild) svg.removeChild(svg.firstChild);

    const size = 2048;

    const topLeft = map.containerPointToLatLng([0,0]);
    const bottomRight = map.containerPointToLatLng([map.getSize().x,map.getSize().y]);

    const spacing = 10;

    const minX = Math.max(0, Math.floor(Math.min(topLeft.lng, bottomRight.lng)));
    const maxX = Math.min(size, Math.ceil(Math.max(topLeft.lng, bottomRight.lng)));
    const minY = Math.max(0, Math.floor(Math.min(topLeft.lat, bottomRight.lat)));
    const maxY = Math.min(size, Math.ceil(Math.max(topLeft.lat, bottomRight.lat)));

    let stroke = 'rgba(255,255,255,0.75)';

    for (let x = minX; x <= maxX; x += spacing) {
      const p1 = map.latLngToLayerPoint([minY, x]);
      const p2 = map.latLngToLayerPoint([maxY, x]);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x);
      line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x);
      line.setAttribute('y2', p2.y);
      line.setAttribute('stroke', stroke);
      line.setAttribute('stroke-width', x%16==0 ? '2':'1');
      svg.appendChild(line);
    }

    for (let y = minY; y <= maxY; y += spacing) {
      const p1 = map.latLngToLayerPoint([y, minX]);
      const p2 = map.latLngToLayerPoint([y, maxX]);
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x);
      line.setAttribute('y1', p1.y);
      line.setAttribute('x2', p2.x);
      line.setAttribute('y2', p2.y);
      line.setAttribute('stroke', stroke);
      line.setAttribute('stroke-width', y%16==0 ? '2' : '1');
      svg.appendChild(line);
    }
  }

  document.addEventListener("keydown",function (e) {

    if (e.target.id.startsWith('searchtext')) return;

    if (e.code=='KeyF') {
      if (e.ctrlKey) {
        searchControl.expand(true);
        e.preventDefault();
      } else {
        //map.toggleFullscreen();
      }

    } else if (e.code=='Enter') {

      if (isGalleryOpen()) {
        selectImage();
      } else {
        if (currentOpenMarker) {
          openGallery(currentOpenMarker.feature.properties.name);
        }
      }
      
    } else if (e.code=='Escape') {
      toggleGallery();
    }

    let slugs = Object.keys(config);

    if (/^Digit[1-4]$/.test(e.code) && +e.code.slice(5) <= slugs.length) setBaseLayer(slugs[+e.code.slice(5)-1]);

  });

}

window.onload = function() {

  if (location.hash.length>1) {
    let param = decodeURIComponent(location.hash.slice(1));
    mapParam.markerName = param;
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('.copyable');
    if (el) {
      // Don't prevent default if Ctrl/Cmd key is held (allow navigation)
      if (e.ctrlKey || e.metaKey) {
        return;
      }
      e.preventDefault();
      let text;
      if (el.tagName === 'A' && el.href) {
        text = el.href;
      } else {
        text = el.textContent.trim();
      }
      if (text) {
        copyToClipboard(text);
      }
    }
  });

  const promises = [
    'data/markers.json',
    'data/markers_intro.json',
    'data/solutions.txt',
    'data/youtube.txt',
    'data/images.txt',
    'data/order.txt',
    'data/wt.txt',
    'data/Localization/en.json',
    'data/solutions.json',
  ].map(url =>
    fetch(url).then(r => url.endsWith('.txt') ? r.text() : r.json())
  );

  Promise.all(promises).then(data => {
    let [base, intro, sol, yt, img, ord, wtd, lg, s2] = data;

    solutions = Object.fromEntries(sol.split('\n').map(s => s.trim().split(':', 2)).filter(([, v])=> v && v.length>=2));
    youtube = Object.fromEntries(yt.split('\n').map(s => s.trim().split(',', 2)).filter(([, v])=> v && v.length>=2));
    imageList = Object.fromEntries(img.split('\n').map(s => s.trim()).filter(Boolean).map(s => [s.replace(/\.[^.]+$/, ''), true]));
    order = Object.fromEntries(ord.split('\n').map(s => s.trim()).filter(Boolean).map((s, i) => [s, i]));
    wt = Object.fromEntries(wtd.trim().split('\n').map(s => { const [n,a,i] = s.trim().split(','); return [n, [a,i]]; }));


    const names = new Set(base.features.map(f => f.properties.name).filter(Boolean));

    for (const f of intro.features) {
      f.properties.baseLayer = 'intro';
      if (names.has(f.properties.name)) f.properties.name = fullName(f.properties.name, f.properties.baseLayer);
    }

    allFeatures = [...base.features, ...intro.features];

    console.log(`loaded ${allFeatures.length} features`);


    for (const s of s2) solutions2[s.name] = s.solution;

    lang = lg;

    drawMap();
  });
}
</script>
